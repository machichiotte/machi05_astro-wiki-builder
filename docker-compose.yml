services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: machi05_astro-wiki:latest
    container_name: machi05_astro-wiki
    ports:
      - "${STREAMLIT_SERVER_PORT:-3005}:3005"
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
    restart: always
